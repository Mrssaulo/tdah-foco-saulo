<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <title>Foco - offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0b1020;
      color: #d1d8f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 24px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #5eead4, #38bdf8);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #0b1020;
      font-weight: 800;
    }
    h1 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.55;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    button {
      background: linear-gradient(135deg, #5eead4, #38bdf8);
      color: #0b1020;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">F</div>
    <h1>Sem conexao agora</h1>
    <p>O Foco nao conseguiu carregar o conteudo. Verifique sua internet ou Wi-Fi e tente de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
    <p class="hint">Suas tarefas salvas continuam guardadas no celular.</p>
  </div>
</body>
</html>
